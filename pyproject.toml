[project]
name = "textblob"
version = "0.20.1"
description = "Simple, Pythonic text processing. Sentiment analysis, part-of-speech tagging, noun phrase parsing, and more."
readme = "README.rst"
license = "MIT"
authors = [{ name = "Steven Loria", email = "oss@stevenloria.com" }]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
]
keywords = ["textblob", "nlp", 'linguistics', 'nltk', 'pattern']
requires-python = ">=3.10"
dependencies = ["nltk>=3.9"]

[project.urls]
Changelog = "https://textblob.readthedocs.io/en/latest/changelog.html"
Issues = "https://github.com/sloria/TextBlob/issues"
Source = "https://github.com/sloria/TextBlob"

[dependency-groups]
docs = ["sphinx", "sphinx-issues", "PyYAML"]
lint = ["pre-commit>=3.5,<5.0"]
tests = ["pytest", "numpy"]
dev = [
  { include-group = "tests" },
  { include-group = "lint" },
  "tox",
  "tox-uv",
  "pyright",
  "ruff",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = ["tests/", "CHANGELOG.rst", "CONTRIBUTING.rst", "tox.ini", "NOTICE"]

[tool.ruff]
src = ["src"]
fix = true
show-fixes = true
unsafe-fixes = true
exclude = [
  # Default excludes from ruff
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
  # Vendorized code
  "src/textblob/en",
  "src/textblob/_text.py",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "B",  # flake8-bugbear
  "E",  # pycodestyle error
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "W",  # pycodestyle warning
  "TC", # flake8-typechecking
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E721"]

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "numpy: marks tests that require numpy",
]

[tool.pyright]
include = ["src/**", "tests/**"]
